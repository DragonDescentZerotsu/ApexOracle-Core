[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexoracle"
version = "0.1.0"
description = "Core prediction, training, and evaluation code for ApexOracle"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]
similarity = [
  "biopython>=1.81",
  "pyyaml>=6",
  "tqdm>=4.64",
]
peplink = ["PepLink==0.1.2"]
data-preparation = [
  "biopython>=1.81",
  "rdkit>=2023.9",
  "selfies>=2.1",
  "torch>=2.1",
  "transformers>=4.40",
  "pyyaml>=6",
  "tqdm>=4.64",
]
benchmark = [
  "torch>=2.1",
  "SmilesPE>=0.0.3",
  "transformers>=4.40",
  "pyyaml>=6",
  "scipy>=1.9",
  "tqdm>=4.64",
]
inference = ["torch>=2.1"]
synergy = [
  "torch>=2.1",
  "peft>=0.15",
  "selfies>=2.1",
  "transformers>=4.40",
  "pyyaml>=6",
  "tqdm>=4.64",
]
figures = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
]
genome-validation = [
  "biopython>=1.81",
  "edlib>=1.3.9",
  "matplotlib>=3.7",
  "pyyaml>=6",
  "scipy>=1.9",
  "torch>=2.1",
]

[project.scripts]
apexoracle-build-fig2b-data = "apexoracle.benchmarks.molecule_encoders.protocol:main"
apexoracle-run-hierarchical-mic = "apexoracle.training.hierarchical_mic_runner:main"
apexoracle-run-antibiotic-classification = "apexoracle.training.antibiotic_classification_runner:main"
apexoracle-run-fig1b-baselines = "apexoracle.benchmarks.fig1b_baselines:main"
apexoracle-analyze-fig1b-significance = "apexoracle.evaluation.paired_classification:main"
apexoracle-assemble-fig1b-predictions = "apexoracle.evaluation.fig1b_results:main"
apexoracle-plot-fig1b-revision = "apexoracle.evaluation.fig1b_plot:main"
apexoracle-run-sequence-similarity = "apexoracle.evaluation.sequence_similarity.runner:main"
apexoracle-run-synergy-cv = "apexoracle.training.synergy_runner:main"
apexoracle-plot-modality-ablation = "apexoracle.evaluation.modality_ablation:main"
apexoracle-build-kmer-embeddings = "apexoracle.features.kmer_cli:main"
apexoracle-embed-strain-texts = "apexoracle.features.strain_text_cli:main"
apexoracle-predict-mic = "apexoracle.prediction.hierarchical_mic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apexoracle.vendor.peptideclm_tokenizer" = ["LICENSE", "README.md", "new_vocab.txt", "new_splits.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
