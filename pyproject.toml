[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexoracle"
version = "0.1.0"
description = "Reusable code for the ApexOracle antibiotic prediction benchmarks"
readme = "Readme.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]
similarity = [
  "biopython>=1.81",
  "pyyaml>=6",
  "tqdm>=4.64",
]
peplink = ["PepLink==0.1.1"]
data-preparation = [
  "rdkit>=2023.9",
  "selfies>=2.1",
  "transformers>=4.40",
  "pyyaml>=6",
  "tqdm>=4.64",
]
benchmark = [
  "torch>=2.1",
  "transformers>=4.40",
  "pyyaml>=6",
  "scipy>=1.9",
  "tqdm>=4.64",
]
synergy = [
  "torch>=2.1",
  "peft>=0.15",
  "selfies>=2.1",
  "transformers>=4.40",
  "pyyaml>=6",
  "tqdm>=4.64",
]
figures = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.scripts]
apexoracle-build-fig2b-data = "apexoracle.benchmarks.molecule_encoders.protocol:main"
apexoracle-run-hierarchical-mic = "apexoracle.training.hierarchical_mic_runner:main"
apexoracle-run-antibiotic-classification = "apexoracle.training.antibiotic_classification_runner:main"
apexoracle-run-sequence-similarity = "apexoracle.evaluation.sequence_similarity.runner:main"
apexoracle-run-synergy-cv = "apexoracle.training.synergy_runner:main"
apexoracle-plot-modality-ablation = "apexoracle.evaluation.modality_ablation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
