schema_version: 1
description: >-
  Final paired Fig. 1b comparisons. ApexOracle fine-tune and every Chemprop
  baseline use 10-member ensembles; strict zero-shot also uses its historical
  10-member ensemble. All comparisons are aligned on identical molecule IDs.

comparisons:
  - name: strict_zero_shot_vs_stokes2020_10member
    family: strict_zero_shot_vs_baseline
    group: 0
    candidate_name: ApexOracle strict zero-shot (10 members)
    baseline_name: Stokes 2020 Chemprop (10 members)
    candidate_predictions: results/fig1b_revision/apexoracle_strict_zero_shot/antibiotic_classification_strict-zero-shot_group_0.csv
    baseline_predictions: results/fig1b_revision/baselines_full_ensemble_no_rdkit/group_0/oof_predictions.csv
    candidate_may_be_superset: true
    metrics: [auprc, auroc]

