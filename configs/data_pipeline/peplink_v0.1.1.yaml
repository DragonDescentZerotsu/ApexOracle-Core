legacy_correction_contract:
  monomer_action: reconstruct_with_peplink_core
  non_monomer_action: preserve_dbaasp_offered_smiles
  preserve_offered_smiles_for_ids: [20478, 20637, 21675, 21676, 21677, 21678, 21751, 21770]
  expected_scope:
    total: 179
    peplink_reconstructed: 169
    preserved_special: 8
    preserved_non_monomer: 2
  peplink_v0.1.1_comparison:
    exact_smiles: 177
    fragment_parent_equivalent: 2
    exceptions:
      - dbaasp_id: 19000
        paper_mic_rows: 2
        token_cache_rows: 2
        difference: legacy_output_contains_two_disconnected_fragments_removed_by_peplink_fragment_parent
      - dbaasp_id: 21769
        paper_mic_rows: 7
        token_cache_rows: 7
        difference: legacy_output_contains_disconnected_methane_removed_by_peplink_fragment_parent
