schema_version: 1
dependency:
  package: PepLink
  version: 0.1.1
  pypi: https://pypi.org/project/PepLink/0.1.1/
  repository: https://github.com/DragonDescentZerotsu/PepLink
  tag: v0.1.1
  git_commit: cec2a02427766e4ba95806924801af31bdcc9939
  license: MIT
  artifacts:
    wheel_sha256: 78cefef15e4027f3d65e7865abaa3f403ef32b70a36c4b3ec7f943deafd1f532
    sdist_sha256: 70687d40923b36e4d181f61b75f098d54d67e2897dcca80600c7d4832a6a67a9

integration:
  strategy: optional_pypi_dependency_and_documented_repository_link
  git_submodule: false
  rationale: PepLink has an independent release lifecycle and public Python API; a submodule would couple source checkout without improving package installation.
  apexoracle_adapter: src/apexoracle/data/peplink_adapter.py
  new_data_policy: use_peplink_0.1.1_fragment_normalization
  paper_reproduction_policy: consume_frozen_paper_csv_by_sha256

paper_inputs:
  dbaasp_json:
    path: DataPrepare/Data/all_peptides_data.json
    sha256: 927ea275f40cdc2f79acdae6a87b0efc13ae5b7acee3901a50d2005a8f187ce0
