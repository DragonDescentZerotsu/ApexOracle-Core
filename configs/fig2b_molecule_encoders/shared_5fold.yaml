protocol_version: fig2b-shared-molecules-v1

data:
  mic_csv: DataPrepare/Data/DBAASP_id_SMILES_bact_MICs.csv
  dbaasp_records_json: DataPrepare/Data/all_peptides_data.json
  output_dir: DataPrepare/Data/fig2b_shared_v1
  target_count: 19

split:
  kind: molecule_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  sort_ids_before_split: true
  inner_validation_fraction: 0.1
  inner_validation_seed: 42
  inner_validation_seed_rule: base_seed_plus_outer_fold

sample_policy:
  shared_ids: true
  shared_folds: true
  allow_post_split_drop: false
  encoder_overflow_policy: truncate_and_record

apex_projection:
  noncanonical_residue: X
  d_residue: uppercase_identity
  cyclic_peptide: linear_residue_order
  multichain_peptide: concatenate_residue_order
  max_content_residues: 50
  x_encoder_index: 23
  x_embedding: mean_canonical_aaindex

encoders:
  - dlm_mtr_dlm
  - dlm_only
  - chemberta_mtr
  - chemberta_mlm
  - molformer
  - peptideclm
  - apex

training:
  encoder_frozen: true
  encoder_feature_mode: eval
  prediction_head_hidden_dims: [384, 128]
  prediction_head_dropout: 0.2
  optimizer: Adam
  learning_rate: 1.0e-4
  max_epochs: 200
  early_stopping_metric: validation_macro_task_r2
  early_stopping_patience: 20
  select_checkpoint_on_outer_test: false
  evaluate_outer_test_once: true

reporting:
  metric: macro_task_r2
  fold_summary: mean_and_sample_standard_deviation
  write_per_sample_predictions: true
