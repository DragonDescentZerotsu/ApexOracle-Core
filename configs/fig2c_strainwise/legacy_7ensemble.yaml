schema_version: 1
protocol: paper_legacy_strainwise_three_fold
status: migration_in_progress_behavior_frozen

source_driver: DP_inhouse_SM_MIC_with_text_genome_test_on_non_seen_strains_MDLM_MTR_fix.py
data_manifest: experiments/fig2c_strainwise/legacy_protocol_manifest.json

model:
  molecule_embedding_dim: 768
  genome_embedding_dim: 8192
  text_embedding_dim: 4096
  attention_heads: 4
  attention_dropout: 0.1
  head_hidden_dims: [3072, 128]
  head_dropout: 0.2
  regression_targets: 1
  missing_genome_embedding: learned_1_by_8192_parameter

training:
  folds: 3
  ensembles_per_fold: 7
  ensemble_seeds: [42, 2024, 2025, 2077, 2012, 1973, 2002]
  epochs: 25
  batch_size: 80
  optimizer: Adam
  learning_rate: 1.0e-5
  weight_decay: 0.0
  scheduler: CosineAnnealingLR
  scheduler_eta_min: 1.0e-10
  freeze_epochs: 5000
  regression_loss: MSELoss
  auxiliary_classification_loss: BCEWithLogitsLoss
  checkpoint_selection: highest_held_out_fold_r2
  mic_transform: -log10(MIC/10)
  genome_embedding_scale: 1.0e14
  text_embedding_scale: 1.0
  optimizer_step_frequency: once_per_nonempty_modality_batch
  amp: cuda_autocast_with_grad_scaler
  gradient_clipping:
    activation_epoch: 5000
    max_norm: 1.0
    genome_attention: true
    text_attention: false
    missing_genome_embedding_for_text_only: true
    regression_head: true
    classification_head: false
    note: classification historically clips regression_head rather than classification_head

archived_results:
  fold_r2: [0.4057, 0.6889, 0.6434]
  mean_r2: 0.5793

legacy_split_recovery:
  status: archived_counts_verified_exact_membership_not_fully_recovered
  cause: process_hash_order_plus_in_place_taxonomy_alias_mutation
  node002_source_identity: exact_sha256_match
